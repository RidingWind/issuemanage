server {
    listen 80;
    server_name localhost;

    # Serve React static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # Important for single-page applications
    }

    # Proxy API requests to the backend service
    # Assumes backend is reachable at 'backend-service-name' on port 5000.
    # You'll need to replace 'backend-service-name' with the actual
    # hostname/service name of your backend when running in Docker Compose or Kubernetes.
    # If running backend on the same Docker host, this might be 'host.docker.internal:5000' (for Docker Desktop)
    # or the Docker host's IP, or a linked service name.
    location /api/ {
        proxy_pass http://backend-service-name:5000/; # Placeholder for backend service
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: You might want to add error pages, gzip compression, etc.
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
